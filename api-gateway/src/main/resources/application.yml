server:
  port: 8084
spring:
  application:
    name: api-gateway
  config:
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
  main:
    web-application-type: reactive
  cloud:
    gateway:
      routes:
        # documentation : https://cloud.spring.io/spring-cloud-gateway/reference/html/#global-filters

        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/api/auth/**

        - id: product-service
          uri: lb://product-service
          predicates:
            - Path=/api/product/**,/api/product,/api/food/**,/api/foods/**,/api/foods

        - id: order-service # order-service route.
          uri: lb://order-service
          predicates:
            - Path=/api/order/**

        - id: inventory-service # inventory-service route.
          uri: lb://inventory-service
          predicates:
            - Path=/api/inventory/**

        - id: workflow-service
          uri: lb://workflow-service
          predicates:
            - Path=/api/workflows/**,/api/workflow/**

        - id: notification-service
          uri: lb://notification-service
          predicates:
            - Path=/api/notifications/**

        - id: analytics-service
          uri: lb://analytics-service
          predicates:
            - Path=/api/analytics/**

        - id: ai-assistant-service
          uri: lb://ai-assistant-service
          predicates:
            - Path=/api/assistant/**,/api/ai/**

        - id: discovery-server  # discovery-server route.
          uri: http://localhost:8761  #--> to be redirected to.
          predicates:
            - Path=/eureka/web        # --> given path in url for the api gateway return only html page.
          filters:
            - SetPath=/

        - id: discovery-server-static # discovery-server-static route
          uri: http://localhost:8761
          predicates:
            - Path=/eureka/**         # -->  for the static resources like css, angular etc.
      globalcors:
        cors-configurations:
          '[/**]':
            allowed-origins: ${FRONTEND_ORIGIN:http://localhost:5173}
            allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
            allowed-headers: Authorization,Content-Type
            allow-credentials: true
foodfusion:
  security:
    jwt:
      secret: ${JWT_SECRET:}
      issuer: ${JWT_ISSUER:http://localhost:8085}
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka  # to Interact with Eureka Discovery server

logging:
  level:
    root: INFO
    org.springframework.cloud.gateway.route.routeDefinitionLocator: INFO
    org.springframework.cloud.gateway: INFO

management: #Distributed Tracing
  tracing:
    sampling:
      probability: 1.0
  endpoints:  #Spring Boot Actuator (for health check and metrics endpoints)
    web:
      exposure:
        include: health,info