spring:
  application:
    name: inventory-service
  config:
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
  datasource:
    url:  jdbc:mysql://localhost:3306/inventory-service
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update

foodfusion:
  seed-data:
    enabled: ${FOODFUSION_SEED_DATA:true}

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka

server:
  port: 8083 # assigns a random port based on the port availability

logging:
  level:
    root: INFO

management: #Distributed Tracing
  tracing:
    sampling:
      probability: 1.0
  endpoints: # Spring Boot Actuator (for health check and metrics endpoints)
    web:
      exposure:
        include: health,info