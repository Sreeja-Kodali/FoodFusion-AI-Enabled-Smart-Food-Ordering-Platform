spring:
  application:
    name: product-service
  config:
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
  data:
    mongodb:
      database: domain_db
      uri: ${MONGODB_URI:mongodb://localhost:27017}
      auto-index-creation: true

foodfusion:
  seed-data:
    enabled: ${FOODFUSION_SEED_DATA:true}

server:
  port: 8081

eureka:  # Eureka client configs
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

management: # Distributed Tracing
  tracing:
    sampling:
      probability: 1.0
  endpoints: # Spring Boot Actuator (for health check and metrics endpoints)
    web:
      exposure:
        include: health,info
